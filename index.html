<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Countdown</title>
<meta name="description" content="Schöne Countdowns für deine wichtigen Termine. Läuft komplett im Browser.">
<meta name="theme-color" content="#f6f3ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141311" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Countdown">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="no-referrer">
<link rel="preload" href="fonts/plus-jakarta-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<script src="countdown-core.js"></script>
<style>
@font-face{font-family:"Plus Jakarta Sans";font-style:normal;font-display:swap;font-weight:200 800;src:url(fonts/plus-jakarta-sans-latin-wght-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Plus Jakarta Sans";font-style:normal;font-display:swap;font-weight:200 800;src:url(fonts/plus-jakarta-sans-latin-ext-wght-normal.woff2) format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
:root{color-scheme:light dark;
  --bg:#f6f3ec;--panel:#ffffff;--ink:#1d1b17;--muted:#716c62;--faint:#716c62;--line:#e7e2d7;--soft:#efeae0;
  --accent:#e5753f;--accent-h:#ec8551;--accent-ink:#1d1b17;--accent-soft:#fbe9dd;--accent-deep:#a94d24;--danger:#c8372f;
  --shadow-sm:0 1px 2px rgba(29,27,23,.05);
  --shadow-md:0 1px 2px rgba(29,27,23,.05),0 10px 30px rgba(29,27,23,.08);
  --shadow-lg:0 2px 4px rgba(29,27,23,.06),0 30px 70px rgba(29,27,23,.16);
  --r:16px;--r-sm:10px;
  --font:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);--spring:cubic-bezier(.34,1.4,.64,1);
}
@media(prefers-color-scheme:dark){:root{
  --bg:#141311;--panel:#1d1b18;--ink:#f3f0e8;--muted:#a39d91;--faint:#8a8478;--line:#2d2a25;--soft:#26231f;
  --accent:#ef8a55;--accent-h:#f69b6b;--accent-ink:#1a0f08;--accent-soft:#3a2418;--accent-deep:#f4a97f;--danger:#ff7a70;
  --shadow-sm:0 1px 2px rgba(0,0,0,.35);
  --shadow-md:0 1px 2px rgba(0,0,0,.35),0 10px 30px rgba(0,0,0,.35);
  --shadow-lg:0 2px 4px rgba(0,0,0,.4),0 30px 70px rgba(0,0,0,.55);
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100%}
body{padding:0 20px calc(40px + env(safe-area-inset-bottom))}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
.wrap{max-width:1040px;margin:0 auto}

/* Header */
header{display:flex;align-items:center;justify-content:space-between;padding:28px 0 8px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;letter-spacing:-.01em}
.brand .dot{width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.now{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}

/* Hero (nearest) */
.hero{margin:28px 0 24px;padding:44px 40px 40px;background:var(--panel);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow-md);position:relative;overflow:hidden;
  animation:rise .7s var(--ease) both}
.hero::before{content:"";position:absolute;inset:-40% -20% auto auto;width:60%;aspect-ratio:1;border-radius:50%;
  background:radial-gradient(closest-side,var(--accent-soft),transparent 70%);opacity:.9;pointer-events:none}
.hero .label{font-size:13px;font-weight:600;color:var(--accent-deep);letter-spacing:.04em;text-transform:uppercase}
.hero h1{margin:6px 0 22px;font-size:clamp(26px,4vw,40px);font-weight:800;letter-spacing:-.03em;line-height:1.1}
.hero .meta{color:var(--muted);font-size:14px;margin-top:18px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.digits{display:flex;gap:clamp(10px,3vw,28px);flex-wrap:wrap}
.unit{min-width:clamp(64px,13vw,120px)}
.unit b{display:block;font-size:clamp(44px,9vw,88px);font-weight:800;letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums}
.unit > span{display:block;margin-top:8px;color:var(--muted);font-size:13px;font-weight:500}
.unit b .flip{display:inline-block;animation:flip .4s var(--spring)}
@keyframes flip{from{transform:translateY(-.25em);opacity:0}to{transform:none;opacity:1}}
.bar{height:6px;border-radius:99px;background:var(--soft);overflow:hidden;margin-top:26px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transform-origin:left;transition:transform 1s linear}
.hero.done .label{color:var(--muted)}
.hero.empty{text-align:center;padding:64px 24px}
.hero.empty h1{font-size:28px}
.hero.empty p{color:var(--muted);max-width:420px;margin:0 auto 22px}

/* Toolbar */
.toolbar{display:flex;justify-content:space-between;align-items:center;margin:10px 0 14px;gap:12px}
.toolbar h2{margin:0;font-size:15px;font-weight:700;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:12px;font-weight:700;font-size:14px;
  transition:transform .18s var(--spring),background .18s,box-shadow .18s,color .18s}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--accent);color:var(--accent-ink);box-shadow:0 1px 2px rgba(0,0,0,.08),0 6px 16px -6px var(--accent)}
.btn.primary:hover{background:var(--accent-h);transform:translateY(-1px)}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.ghost:hover{background:var(--line)}
.btn.danger{color:var(--danger)}
.btn:focus-visible,.icon:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.btn svg{width:18px;height:18px}

/* Grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:22px 22px 20px;box-shadow:var(--shadow-sm);position:relative;
  transition:transform .35s var(--ease),box-shadow .35s var(--ease),border-color .35s;animation:rise .6s var(--ease) both;animation-delay:var(--d,0s)}
.card:hover{transform:translateY(-4px);box-shadow:var(--shadow-md);border-color:transparent}
.card h3{margin:0 0 2px;font-size:17px;font-weight:700;letter-spacing:-.01em;padding-right:36px}
.card .date{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.card .big{margin:18px 0 2px;font-size:46px;font-weight:800;letter-spacing:-.045em;line-height:1;font-variant-numeric:tabular-nums}
.card .big small{font-size:15px;font-weight:600;color:var(--muted);letter-spacing:0;margin-left:6px}
.card .sub{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.card .bar{margin-top:16px;height:4px}
.card.past .big{color:var(--muted)}
.card .menu{position:absolute;top:14px;right:14px;display:flex;gap:2px;opacity:0;transform:translateY(-2px);transition:opacity .2s,transform .2s var(--ease)}
.card:hover .menu,.card:focus-within .menu{opacity:1;transform:none}
.card .menu{background:var(--panel);border-radius:10px;padding:2px}
@media(hover:none){.card{display:flex;flex-direction:column}.card h3{padding-right:0}
  .card .menu{opacity:1;transform:none;position:static;order:10;justify-content:flex-end;margin:12px -8px -8px;padding:0;border-top:1px solid var(--line);padding-top:6px;border-radius:0}
  .card .icon{width:44px;height:44px}}
.icon{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;color:var(--muted);transition:background .15s,color .15s,transform .15s var(--spring)}
.icon:hover{background:var(--soft);color:var(--ink)}
.icon:active{transform:scale(.9)}
.icon svg{width:16px;height:16px}

/* Dialog */
dialog{border:0;padding:0;background:transparent;max-width:none;width:100%;height:100%;max-height:none;margin:0}
dialog::backdrop{background:rgba(20,18,14,.45);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);animation:fade .25s both}
dialog[open]{display:grid;place-items:center;padding:16px}
.sheet{width:min(440px,100%);background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:var(--shadow-lg);
  animation:pop .45s var(--spring) both}
.sheet h2{margin:0 0 18px;font-size:22px;font-weight:800;letter-spacing:-.02em}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:6px;letter-spacing:.02em}
.field input{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);outline:0;transition:border-color .15s,box-shadow .15s}
.field input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:22px}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin:-4px 0 16px}
.chip{padding:6px 12px;border-radius:99px;background:var(--soft);font-size:12.5px;font-weight:600;color:var(--muted);transition:all .15s}
.chip:hover{background:var(--accent-soft);color:var(--accent-deep)}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--bg);padding:8px 8px 8px 18px;min-height:44px;border-radius:12px;font-size:14px;font-weight:600;
  box-shadow:var(--shadow-lg);transition:transform .4s var(--spring),opacity .3s;pointer-events:none;z-index:9;display:flex;align-items:center;gap:12px;max-width:calc(100vw - 32px)}
.toast:not(:has(button)){padding-right:18px}
.toast.show{transform:translate(-50%,0);opacity:1;pointer-events:auto}
.toast button{color:var(--accent);font-weight:800;padding:6px 10px;border-radius:8px}
.toast button:hover{background:rgba(127,127,127,.18)}
.picklist{max-height:min(50vh,360px);overflow:auto;margin:0 -6px 4px;padding:0 6px}
.pick{display:flex;gap:12px;align-items:flex-start;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.pick:last-child{border-bottom:0}
.pick input{margin-top:3px;width:18px;height:18px;accent-color:var(--accent);flex:none}
.pick b{display:block;font-weight:700}
.pick span{color:var(--muted);font-size:13px}
.pick.past span{opacity:.8}
.sheet p.lead{margin:-10px 0 16px;color:var(--muted)}

footer{margin-top:48px;text-align:center;color:var(--faint);font-size:12.5px;line-height:1.7}
footer a{color:inherit}

@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.96)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@media(max-width:600px){.hero{padding:30px 22px 26px;border-radius:20px}.row{grid-template-columns:1fr}body{padding:0 14px calc(40px + env(safe-area-inset-bottom))}.toolbar{flex-wrap:wrap}.tools{width:100%}.tools .btn{flex:1 1 auto;justify-content:center;padding:11px 14px}.lg-only{display:none}}
@media(min-width:601px){.sm-only{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><span class="dot" aria-hidden="true"></span>Countdown</div>
    <div class="now" id="now"></div>
  </header>

  <main>
    <section class="hero" id="hero" aria-labelledby="heroTitle"></section>

    <div class="toolbar">
      <h2 id="count"></h2>
      <div class="tools">
        <button class="btn ghost" id="import" type="button" title="Termine aus einer Kalenderdatei (.ics) übernehmen">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4M12 12v6M9 15l3 3 3-3"/></svg>
          <span class="lg-only">Kalender importieren</span><span class="sm-only">Importieren</span>
        </button>
        <button class="btn primary" id="add" type="button">
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          Neuer Countdown
        </button>
      </div>
      <input type="file" id="icsFile" accept=".ics,text/calendar" hidden>
    </div>

    <section class="grid" id="grid" aria-label="Alle Countdowns"></section>
  </main>

  <footer>Alles bleibt in diesem Browser gespeichert – nichts wird hochgeladen.<br>Teilen per Link überträgt nur den einzelnen Countdown. Funktioniert auch offline.</footer>
</div>

<dialog id="dlg" aria-labelledby="dlgTitle">
  <form class="sheet" id="form" method="dialog">
    <h2 id="dlgTitle">Neuer Countdown</h2>
    <p class="lead" id="dlgLead" hidden></p>
    <div class="field"><label for="fName">Was zählst du runter?</label><input id="fName" placeholder="z. B. Ramadan, Abgabe, Flug nach Jakarta" required maxlength="60" autocomplete="off"></div>
    <div class="quick" id="quick" role="group" aria-label="Schnellauswahl Datum"></div>
    <div class="row">
      <div class="field"><label for="fDate">Datum</label><input id="fDate" type="date" required min="1900-01-01" max="2999-12-31"></div>
      <div class="field"><label for="fTime">Uhrzeit</label><input id="fTime" type="time" value="00:00"></div>
    </div>
    <div class="actions">
      <button type="button" class="btn ghost" id="cancel">Abbrechen</button>
      <button type="submit" class="btn primary" id="save">Speichern</button>
    </div>
  </form>
</dialog>

<dialog id="dlgImport" aria-labelledby="impTitle">
  <form class="sheet" id="impForm" method="dialog">
    <h2 id="impTitle">Termine übernehmen</h2>
    <p class="lead" id="impLead"></p>
    <div class="picklist" id="impList"></div>
    <div class="actions">
      <button type="button" class="btn ghost" id="impCancel">Abbrechen</button>
      <button type="submit" class="btn primary" id="impSave">Übernehmen</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const C=window.CountdownCore;
const KEY='countdowns.v1';
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const fmtDate=d=>d.toLocaleDateString('de-DE',{weekday:'short',day:'numeric',month:'long',year:'numeric'})+(d.getHours()||d.getMinutes()?' · '+pad(d.getHours())+':'+pad(d.getMinutes()):'');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const ICON={
  share:'<path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7"/><path d="M16 6l-4-4-4 4"/><path d="M12 2v13"/>',
  cal:'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4M12 13v5M9.5 15.5h5"/>',
  edit:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
  del:'<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/>'};
const svg=n=>`<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICON[n]}</svg>`;

// ---- Storage ----
function load(){try{const v=JSON.parse(localStorage.getItem(KEY));return Array.isArray(v)?v.filter(i=>i&&typeof i.name==='string'&&Number.isFinite(i.at)):[]}catch{return[]}}
let items=load();
function persist(){try{localStorage.setItem(KEY,JSON.stringify(items))}catch{toast('Speichern nicht möglich – ist der private Modus aktiv?')}}
// Changes in another tab (or the installed app) show up here too.
addEventListener('storage',e=>{if(e.key===KEY){items=load();render()}});
function uid(){return (crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2)).slice(0,12)}
function sorted(){const now=Date.now();return[...items].sort((a,b)=>{const pa=a.at<now,pb=b.at<now;if(pa!==pb)return pa-pb;return pa?b.at-a.at:a.at-b.at})}
function progress(it){const span=it.at-it.created;if(span<=0)return 1;return Math.min(1,Math.max(0,(Date.now()-it.created)/span))}
const exists=(name,at)=>items.some(i=>i.name===name&&i.at===at);
function addItem(name,at){const it={id:uid(),name,at,created:Math.min(Date.now(),at)};items.push(it);return it}

// ---- Render ----
function render(){
  const list=sorted();const now=Date.now();
  const up=list.filter(i=>i.at>now).length;
  $('#count').textContent=list.length?`${list.length} Countdown${list.length>1?'s':''}${up<list.length?` · ${list.length-up} vorbei`:''}`:'';
  const hero=$('#hero');
  const next=list.find(i=>i.at>now);
  if(!list.length){hero.className='hero empty';delete hero.dataset.id;hero.innerHTML=`<h1 id="heroTitle">Noch nichts, worauf du wartest</h1><p>Leg einen Countdown an – für den nächsten Flug, eine Abgabe oder den Tag, an dem etwas Neues beginnt. Oder übernimm Termine aus deinem Kalender.</p><button class="btn primary" type="button" onclick="openDlg()">Ersten Countdown anlegen</button>`}
  else if(!next){const last=list[0];hero.className='hero done';hero.dataset.id=last.id;hero.innerHTML=`<div class="label">Vorbei</div><h1 id="heroTitle">${esc(last.name)}</h1><div class="meta">${fmtDate(new Date(last.at))}</div>`}
  else{hero.className='hero';hero.dataset.id=next.id;hero.innerHTML=`<div class="label">Als Nächstes</div><h1 id="heroTitle">${esc(next.name)}</h1>
    <div class="digits" role="timer" aria-live="off" aria-label="Verbleibende Zeit">${['d','h','m','s'].map(u=>`<div class="unit"><b data-u="${u}">00</b><span>${{d:'Tage',h:'Stunden',m:'Minuten',s:'Sekunden'}[u]}</span></div>`).join('')}</div>
    <div class="bar" aria-hidden="true"><i id="heroBar"></i></div>
    <div class="meta"><span>${fmtDate(new Date(next.at))}</span></div>`}
  $('#grid').innerHTML=list.map((it,i)=>`<article class="card ${it.at<now?'past':''}" data-id="${it.id}" style="--d:${Math.min(i,12)*50}ms" aria-labelledby="t-${it.id}">
    <div class="menu">
      <button class="icon" type="button" data-act="share" title="Teilen" aria-label="„${esc(it.name)}“ teilen">${svg('share')}</button>
      <button class="icon" type="button" data-act="ics" title="In Kalender eintragen (.ics)" aria-label="„${esc(it.name)}“ in Kalender eintragen">${svg('cal')}</button>
      <button class="icon" type="button" data-act="edit" title="Bearbeiten" aria-label="„${esc(it.name)}“ bearbeiten">${svg('edit')}</button>
      <button class="icon" type="button" data-act="del" title="Löschen" aria-label="„${esc(it.name)}“ löschen">${svg('del')}</button>
    </div>
    <h3 id="t-${it.id}">${esc(it.name)}</h3><div class="date">${fmtDate(new Date(it.at))}</div>
    <div class="big" data-big></div><div class="sub" data-sub></div>
    <div class="bar" aria-hidden="true"><i data-bar></i></div></article>`).join('');
  tick(true);
}
$('#grid').addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const id=b.closest('.card').dataset.id;
  ({share,ics:exportIcs,edit:openDlg,del:remove})[b.dataset.act](id)});

const dayWord=n=>n===1?'Tag':'Tage';
function tick(force){
  const now=Date.now();
  $('#now').textContent=new Date(now).toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long'});
  const hero=$('#hero');const hid=hero.dataset.id;const h=items.find(i=>i.id===hid);
  if(h&&h.at>now){const p=C.parts(now,h.at);
    hero.querySelectorAll('[data-u]').forEach(el=>{const v=pad(p[el.dataset.u]);if(el.textContent!==v||force){el.innerHTML=`<span class="flip">${v}</span>`}});
    const bar=$('#heroBar');if(bar)bar.style.transform=`scaleX(${progress(h)})`;
    const t=`${p.d?`${p.d} ${dayWord(p.d)}`:`${pad(p.h)}:${pad(p.m)}:${pad(p.s)}`} · ${h.name}`;if(document.title!==t)document.title=t;
  }else{if(h&&h.at<=now&&!hero.classList.contains('done')){render();return}if(document.title!=='Countdown')document.title='Countdown'}
  document.querySelectorAll('.card').forEach(c=>{const it=items.find(i=>i.id===c.dataset.id);if(!it)return;
    const diff=it.at-now;const p=C.parts(now,it.at);const big=c.querySelector('[data-big]'),sub=c.querySelector('[data-sub]');
    if(diff>0){
      if(p.d>0){big.innerHTML=`${p.d}<small>${dayWord(p.d)}</small>`;sub.textContent=`${pad(p.h)}:${pad(p.m)}:${pad(p.s)} verbleibend`}
      else{big.innerHTML=`${pad(p.h)}:${pad(p.m)}:${pad(p.s)}`;sub.textContent='Heute'}
      c.classList.remove('past')
    }else{
      if(p.d>0){big.innerHTML=`${p.d}<small>${dayWord(p.d)}</small>`;sub.textContent=`vorbei – seit ${p.d===1?'gestern':p.d+' Tagen'}`}
      else{big.innerHTML=`${pad(p.h)}:${pad(p.m)}`;sub.textContent=p.h||p.m?'Stunden : Minuten her':'Gerade eben'}
      c.classList.add('past')}
    const bar=c.querySelector('[data-bar]');if(bar)bar.style.transform=`scaleX(${progress(it)})`;
  });
}
// Align ticks to full seconds; after sleep/background the next tick simply shows the correct time again.
(function loop(){tick();setTimeout(loop,1000-Date.now()%1000+5)})();
document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});

// ---- Dialog: add / edit / take over shared link ----
const dlg=$('#dlg');let editing=null,sharedMode=false;
function openDlg(id,preset){editing=id||null;sharedMode=!!preset;const it=items.find(i=>i.id===id);
  $('#dlgTitle').textContent=preset?'Countdown übernehmen?':it?'Countdown bearbeiten':'Neuer Countdown';
  const lead=$('#dlgLead');lead.hidden=!preset;lead.textContent=preset?'Jemand hat dir diesen Countdown geschickt. Du kannst ihn vor dem Speichern anpassen.':'';
  $('#save').textContent=preset?'Übernehmen':'Speichern';
  const src=preset||it;
  $('#fName').value=src?src.name:'';
  const d=src?new Date(src.at):new Date(Date.now()+7*864e5);
  $('#fDate').value=ymd(d);
  $('#fTime').value=src?`${pad(d.getHours())}:${pad(d.getMinutes())}`:'00:00';
  dlg.showModal();if(!preset)setTimeout(()=>$('#fName').focus(),50)}
$('#add').onclick=()=>openDlg();
$('#cancel').onclick=()=>dlg.close();
dlg.addEventListener('click',e=>{if(e.target===dlg)dlg.close()});
$('#form').onsubmit=e=>{e.preventDefault();
  const name=$('#fName').value.trim();const at=new Date($('#fDate').value+'T'+($('#fTime').value||'00:00')).getTime();
  if(!name||!Number.isFinite(at)){toast('Bitte Namen und ein gültiges Datum angeben.');return}
  if(editing){const it=items.find(i=>i.id===editing);it.name=name;it.at=at;if(it.created>at)it.created=Math.min(Date.now(),at)}
  else if(sharedMode&&exists(name,at)){dlg.close();toast('Ist schon in deiner Liste');return}
  else addItem(name,at);
  persist();dlg.close();render();toast(editing?'Gespeichert':sharedMode?'Countdown übernommen':'Countdown angelegt')};
// Quick picks
const quick=[['Morgen',1],['In 1 Woche',7],['In 1 Monat','1m'],['In 100 Tagen',100],['Jahreswechsel','ny']];
$('#quick').innerHTML=quick.map(([l,v])=>`<button type="button" class="chip" data-v="${v}">${l}</button>`).join('');
$('#quick').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;const v=b.dataset.v;let d=new Date();
  if(v==='ny')d=new Date(d.getFullYear()+1,0,1);
  else if(v==='1m'){const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+1);d.setDate(Math.min(day,new Date(d.getFullYear(),d.getMonth()+1,0).getDate()))}
  else d.setDate(d.getDate()+ +v);
  $('#fDate').value=ymd(d);$('#fTime').value='00:00';
  if(v==='ny'&&!$('#fName').value)$('#fName').value='Neues Jahr'};

// Shared link: ?n=name&t=ms (old links ?add=name|ms still work). Ask before adding.
(function(){const sh=C.parseShare(location.search);if(!/[?&](n|t|add)=/.test(location.search))return;
  history.replaceState(null,'',location.pathname);
  if(!sh){setTimeout(()=>toast('Der geteilte Link ist unvollständig.'),300);return}
  if(exists(sh.name,sh.at)){setTimeout(()=>toast(`„${sh.name}“ ist schon in deiner Liste`),300);return}
  setTimeout(()=>openDlg(null,sh),250)})();

// ---- Delete with undo ----
function remove(id){const idx=items.findIndex(i=>i.id===id);if(idx<0)return;const [it]=items.splice(idx,1);persist();render();
  toast(`„${it.name}“ gelöscht`,{label:'Rückgängig',fn:()=>{items.splice(Math.min(idx,items.length),0,it);persist();render();toast('Wiederhergestellt')}},5000)}

// ---- Share ----
async function share(id){const it=items.find(i=>i.id===id);const url=C.shareUrl(location.href,it);
  const d=new Date(it.at);const text=`Countdown: ${it.name} – ${fmtDate(d)}`;
  if(navigator.share&&matchMedia('(hover:none)').matches){try{await navigator.share({title:it.name,text,url});return}catch(e){if(e.name==='AbortError')return}}
  try{await navigator.clipboard.writeText(url);toast('Link kopiert')}catch{prompt('Link zum Teilen:',url)}}

// ---- Calendar export / import ----
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5e3)}
function exportIcs(id){const it=items.find(i=>i.id===id);const fn=(it.name.replace(/[^\p{L}\p{N} _-]+/gu,'').trim().replace(/\s+/g,'-')||'countdown')+'.ics';
  download(fn,C.buildIcs([it]),'text/calendar;charset=utf-8');toast('Kalenderdatei erstellt – öffne sie, um den Termin einzutragen')}
const dlgI=$('#dlgImport');let found=[];
$('#import').onclick=()=>$('#icsFile').click();
$('#icsFile').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(f)importFile(f)};
async function importFile(f){
  if(f.size>5e6)return toast('Die Datei ist zu groß (max. 5 MB).');
  let ev;try{ev=C.parseIcs(await f.text())}catch{ev=[]}
  if(!ev.length)return toast('Keine Termine in der Datei gefunden.');
  const now=Date.now();
  found=ev.filter(x=>!exists(x.name,x.at)).sort((a,b)=>{const pa=a.at<now,pb=b.at<now;return pa!==pb?pa-pb:pa?b.at-a.at:a.at-b.at}).slice(0,300);
  if(!found.length)return toast('Alle Termine sind schon in deiner Liste.');
  const upcoming=found.filter(x=>x.at>now).length;
  $('#impLead').textContent=`${found.length} Termin${found.length>1?'e':''} gefunden${upcoming<found.length?`, davon ${upcoming} in der Zukunft`:''}. Wähle aus, was du runterzählen willst.`;
  $('#impList').innerHTML=found.map((x,i)=>`<label class="pick ${x.at<now?'past':''}"><input type="checkbox" value="${i}" ${x.at>now&&i<10?'checked':''}><div><b>${esc(x.name)}</b><span>${fmtDate(new Date(x.at))}${x.at<now?' · vorbei':''}</span></div></label>`).join('');
  dlgI.showModal()}
$('#impCancel').onclick=()=>dlgI.close();
dlgI.addEventListener('click',e=>{if(e.target===dlgI)dlgI.close()});
$('#impForm').onsubmit=e=>{e.preventDefault();const sel=[...$('#impList').querySelectorAll('input:checked')].map(x=>found[+x.value]);
  if(!sel.length){toast('Nichts ausgewählt.');return}
  sel.forEach(x=>addItem(x.name,x.at));persist();dlgI.close();render();toast(`${sel.length} Countdown${sel.length>1?'s':''} übernommen`)};
// Drop an .ics file anywhere on the page
addEventListener('dragover',e=>{if([...(e.dataTransfer?.types||[])].includes('Files'))e.preventDefault()});
addEventListener('drop',e=>{const f=e.dataTransfer?.files?.[0];if(!f)return;e.preventDefault();if(/\.ics$/i.test(f.name)||f.type==='text/calendar')importFile(f);else toast('Nur Kalenderdateien (.ics) können importiert werden.')});

// ---- Toast (with optional action) ----
let tt;function toast(m,action,ms=2200){const t=$('#toast');t.innerHTML='';t.append(document.createTextNode(m));
  if(action){const b=document.createElement('button');b.type='button';b.textContent=action.label;b.onclick=()=>{t.classList.remove('show');action.fn()};t.append(b)}
  t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),action?ms:Math.max(ms,m.length*55))}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

render();
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
